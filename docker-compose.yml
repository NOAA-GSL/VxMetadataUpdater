services:
  vxmetadataupdater:
    build:
      context: .
      dockerfile: Dockerfile
    image: vxmetadataupdater:local
    container_name: vxmetadataupdater
    working_dir: /app
    volumes:
      - ./settings.json:/app/settings.json:ro
      - ${HOME}/credentials:/run/config/credentials:ro
      - ./output:/app/output
    environment:
      VX_APP: ${VX_APP:-}
      VX_OUTPUT_PATH: ${VX_OUTPUT_PATH:-}
      # Increase when remote clusters need longer bucket readiness checks.
      BUCKET_READY_TIMEOUT_SECONDS: ${BUCKET_READY_TIMEOUT_SECONDS:-60}
    command:
      - "-c"
      - "/run/config/credentials"
      - "-s"
      - "/app/settings.json"
      - "-a"
      - "${VX_APP}"
      - "-p"
      - "${VX_OUTPUT_PATH}"