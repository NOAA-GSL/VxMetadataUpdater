services:
  vxmetadataupdater:
    build:
      context: .
      dockerfile: Dockerfile
    image: vxmetadataupdater:local
    container_name: vxmetadataupdater
    working_dir: /app
    volumes:
      - ./settings.json:/app/settings.json:ro
      - ${HOME}/credentials:/run/config/credentials:ro
      - ./output:/app/output
      # Optional Capella CA cert mount; uncomment and set CACERT_FILE below if needed.
      - ${HOME}/capella-root.pem:/app/certs/capella-root.pem:ro
    environment:
      VX_APP: ${VX_APP:-}
      VX_OUTPUT_PATH: ${VX_OUTPUT_PATH:-}
      # Set to /app/certs/capella-root.pem when using Capella.
      CACERT_FILE: ${CACERT_FILE:-}
    command:
      - "-c"
      - "/run/config/credentials"
      - "-s"
      - "/app/settings.json"
      - "-a"
      - "${VX_APP}"
      - "-p"
      - "${VX_OUTPUT_PATH}"